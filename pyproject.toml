# Declared explicitly: without a [build-system] table, `pip install .` falls
# back to legacy setuptools behaviour, which breaks under the
# --no-build-isolation used by the Flatpak manifest.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yaga-gallery"
version = "0.3.1"
description = "GTK4/libadwaita gallery app"
requires-python = ">=3.11"
dependencies = [
    # Pillow floor: every photo Yaga opens is untrusted input (a scanned
    # folder, a Nextcloud server), so the decoders have to be current.
    # 12.3 is the first release clear of the 2026 decoder advisories —
    # OOB writes in Image.paste/crop, ImageCmsTransform.apply, RankFilter
    # and the PSD/TGA/JPEG2000 paths, plus several decompression-bomb
    # bypasses. 10.3 (the previous floor) carries 34 known advisories.
    # Re-check with: pip-audit, or OSV for the pinned version.
    "Pillow>=12.3",
    "pycairo>=1.25",
    "PyGObject>=3.46",
    # defusedxml hardens the PROPFIND parser against XML billion-laughs / DoS
    # from malicious or MitM'd Nextcloud responses.
    "defusedxml>=0.7",
]

[project.scripts]
yaga = "yaga.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
# Without this filter setuptools' auto-discovery treats every top-level
# directory as a package: `pip install .` was putting tests/, data/, tools/,
# po/ — and any stale build/ — into site-packages as importable top-level
# names. `import tests` from an unrelated project would then have found this
# one's suite.
include = ["yaga*"]

[tool.setuptools.package-data]
yaga = [
    "data/icons/hicolor/128x128/apps/*.png",
    "data/icons/hicolor/scalable/apps/*.svg",
    "data/icons/hicolor/symbolic/apps/*.svg",
    "data/icons/*.png",
    "data/*.css",
    # Compiled gettext catalogues. Built by `tools/i18n.py compile`; when they
    # are absent the app reads po/*.po directly (see yaga/i18n.py).
    "data/locale/*/LC_MESSAGES/*.mo",
]

[tool.setuptools.data-files]
"share/applications" = ["data/io.github.miscde.Yaga.desktop"]
"share/metainfo" = ["data/io.github.miscde.Yaga.metainfo.xml"]
"share/icons/hicolor/128x128/apps" = [
    "yaga/data/icons/hicolor/128x128/apps/io.github.miscde.Yaga.png",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly rather than left to ruff's defaults. Those defaults widen
# between releases — 0.16 added BLE, UP, C4, RUF and TRY to them, which turned
# a green tree into 321 findings on a CI runner that happened to install a
# newer ruff than the one on the developer's machine. What the project lints
# for should be a decision in this file, not a function of when you last
# upgraded. E4/E7/E9 + F is what ruff's default set was when this project
# adopted it — not all of E, which would add line-length and whitespace rules
# the codebase does not follow.
select = ["E4", "E7", "E9", "F"]
# Minus the rules that fight this project's deliberate GTK/PyGObject idioms.
ignore = [
    # gi.require_version("Gtk", "4.0") must run BEFORE `from gi.repository
    # import ...`, so module-level imports legitimately can't all sit at the
    # top of the file.
    "E402",
    # `import gi; gi.require_version(...)` one-liners are idiomatic here.
    "E701",
    "E702",
    # `l` is used throughout as the (label) element of (category, label, path)
    # tuples; renaming every unpacking site adds noise without clarity.
    "E741",
]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports submodule symbols on purpose (see its __all__).
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
# PyGObject ships no type stubs; gi.* is dynamically generated. Don't drown
# real type errors in "module is untyped" noise from the GTK bindings.
ignore_missing_imports = true
files = ["yaga"]
# Untyped defs still get checked internally; without this a function missing
# an annotation is skipped whole, which is most of what we want to catch.
check_untyped_defs = true
warn_redundant_casts = true
# NOT warn_unused_ignores: gi.* has no stubs here, so every GTK expression is
# Any and the `type: ignore`s on PyGObject attributes read as unused. They are
# not — they carry a setup that has PyGObject stubs installed. Enabling this
# would flag 37 comments that are load-bearing elsewhere.
warn_unused_ignores = false

# Yaga never imports numpy — it arrives through Pillow's stubs. Those stubs
# use `type X = ...` (3.12+ syntax), which is a hard parse error under
# python_version 3.11 and aborts the whole run before a single Yaga file is
# checked. Skipping the module keeps the 3.11 target honest.
[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true
