  Hand-written on the 16x16 grid, filled shapes only (GTK recolours a symbolic
  icon through `fill`; strokes and bounding boxes would not follow the theme,
  see flash-on-symbolic.svg). The rings are even-odd paths: an outer and an
  inner ellipse in one path, the space between them filled.
-->
