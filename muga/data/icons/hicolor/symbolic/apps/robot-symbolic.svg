<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16"
     version="1.1" id="robot-symbolic">
  <title id="title-robot">robot</title>
  <g id="layer1" style="fill:currentColor">
    <!-- Antenna: a dot on a short stalk. -->
    <path style="fill:currentColor"
          d="M 8,0.25 A 1.25,1.25 0 0 0 7.5,2.64 V 3.5 h 1 V 2.64 A 1.25,1.25 0 0 0 8,0.25 Z"
          id="antenna" />
    <!-- Ears, one either side of the head. -->
    <path style="fill:currentColor"
          d="M 1,6.5 H 1.75 V 9.5 H 1 A 0.75,0.75 0 0 1 0.25,8.75 V 7.25 A 0.75,0.75 0 0 1 1,6.5 Z"
          id="ear-left" />
    <path style="fill:currentColor"
          d="M 15,6.5 H 14.25 V 9.5 H 15 A 0.75,0.75 0 0 0 15.75,8.75 V 7.25 A 0.75,0.75 0 0 0 15,6.5 Z"
          id="ear-right" />
    <!-- Head, with the eyes and mouth cut out of the same path so the
         silhouette reads at 16 px without relying on a background colour a
         symbolic icon does not have. -->
    <path style="fill:currentColor" fill-rule="evenodd"
          d="M 4.5,3.5 H 11.5 A 2.5,2.5 0 0 1 14,6 V 10 A 2.5,2.5 0 0 1 11.5,12.5 H 4.5 A 2.5,2.5 0 0 1 2,10 V 6 A 2.5,2.5 0 0 1 4.5,3.5 Z
             M 7.25,7 A 1.25,1.25 0 0 0 6,5.75 1.25,1.25 0 0 0 4.75,7 1.25,1.25 0 0 0 6,8.25 1.25,1.25 0 0 0 7.25,7 Z
             M 11.25,7 A 1.25,1.25 0 0 0 10,5.75 1.25,1.25 0 0 0 8.75,7 1.25,1.25 0 0 0 10,8.25 1.25,1.25 0 0 0 11.25,7 Z
             M 5.75,9.75 H 10.25 A 0.5,0.5 0 0 1 10.25,10.75 H 5.75 A 0.5,0.5 0 0 1 5.75,9.75 Z"
          id="head" />
  </g>
</svg>
