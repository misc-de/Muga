<?xml version="1.0" encoding="UTF-8"?>
<!--
  Flash / torch glyph for the camera's flash toggle.

  Hand-written on the 16x16 grid symbolic icons use, rather than exported from
  Inkscape. The exported version carried a 16x16 <rect style="fill:none"> as its
  bounding box, and GTK renders a symbolic icon by prepending a stylesheet that
  sets `fill: <colour> !important` on rect/circle/path/polygon/polyline. The
  !important beat the rect's own fill:none, so the box was painted solid and
  covered the bolt: the button showed a filled square. Nothing here relies on a
  fill that GTK is going to override, and there is no bounding box to fill.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <path d="M 9.5 1 C 9.17 1.01 8.86 1.19 8.68 1.47 L 3.68 9.47 C 3.29 10.1 3.74 10.92 4.48 10.92 L 6.5 10.92 L 6.5 14.5 C 6.5 15.5 7.81 15.88 8.35 15.03 L 13.35 7.03 C 13.74 6.4 13.29 5.58 12.55 5.58 L 10.5 5.58 L 10.5 2 C 10.5 1.44 10.06 0.98 9.5 1 Z"/>
</svg>
